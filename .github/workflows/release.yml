name: Release Pipeline

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tag
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build application
        env:
          dbUrl: "jdbc://mysql:userdb"
        working-directory: oopdi
        run: mvn clean package --file pom.xml -DdbUsername=dbUser1 -Dcounter=4

      - name: Upload artifact to existing GitHub Release
        run: gh release upload "${{ github.ref_name }}" oopdi/target/*.jar --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
